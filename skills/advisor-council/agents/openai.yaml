interface:
  display_name: "Advisor Council"
  short_description: "Consult an advisor model or two-model council for risk and visual guidance"
  default_prompt: "Use $advisor-council for compact decision advice. By default, prefer the configured gateway and use direct Codex only if its token preflight cannot connect or times out. For complex text decisions where a second perspective could change the next action, use --complexity complex with the exact distinct --council-model, followed by the primary model's own verdict and assessment. Send actual screenshots for visual work; use scoped reading when needed. Preserve authority, recovery, and independent acceptance."
